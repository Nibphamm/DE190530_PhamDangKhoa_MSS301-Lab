spring.application.name=DE190530MediaGateway
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/docs/user/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].id=user-docs
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/docs/user/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[1].id=post-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/posts/**
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=/docs/post/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].id=post-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/post/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2
