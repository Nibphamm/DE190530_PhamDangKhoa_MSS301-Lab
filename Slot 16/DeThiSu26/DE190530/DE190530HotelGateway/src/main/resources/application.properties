spring.application.name=DE190530HotelGateway
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].id=room-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms/**
springdoc.swagger-ui.urls[0].name=room-service
springdoc.swagger-ui.urls[0].url=/docs/room/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].id=room-docs
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/docs/room/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[1].id=reservation-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations/**
springdoc.swagger-ui.urls[1].name=reservation-service
springdoc.swagger-ui.urls[1].url=/docs/reservation/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].id=reservation-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/reservation/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

# The gateway and downstream services both support CORS. Keep one header.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
