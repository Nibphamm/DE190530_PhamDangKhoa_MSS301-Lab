services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: Saga@12345
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d shippingdb"]
      interval: 5s
      timeout: 5s
      retries: 30
  shipping-service:
    build: ./shipping-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shippingdb
      DB_USER: saga
      DB_PASSWORD: Saga@12345
    depends_on:
      postgres:
        condition: service_healthy
  order-service:
    environment:
      SPRING_PROFILES_ACTIVE: shipping,recovery
      SHIPPING_URL: http://shipping-service:8084
    depends_on:
      shipping-service:
        condition: service_started
volumes:
  postgres-data:
